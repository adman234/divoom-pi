# divoom-pi configuration.
#
# Installed to /etc/divoom-pi/config.ini. Every value here is a default -
# delete a line to go back to it. Apply changes with:
#
#     sudo systemctl restart divoom-pi

[gateway]
# Address to listen on. 0.0.0.0 means "any interface".
listen = 0.0.0.0

# The Home Assistant integration hard-codes 7777 when it talks to a gateway,
# so only change this if you are forwarding a port in front of it.
port = 7777

# How many Home Assistant instances (or debugging tools) may connect at once.
max_clients = 4

# DEBUG logs every byte in both directions - the first thing to turn on when
# something is not working. See it with: journalctl -u divoom-pi -f
log_level = INFO

[bluetooth]
# Seconds to wait for the Divoom to accept an RFCOMM connection. A sleeping
# device can take a while to answer.
connect_timeout = 15

# How long a read on the Bluetooth socket blocks before checking for shutdown.
read_timeout = 1

# 0 sends each message to the device in one write, which is what you want.
# Raise it (e.g. 200) only if a device turns out to choke on large image or
# animation frames, in which case write_delay adds a pause between chunks.
write_chunk = 0
write_delay = 0

# Try a just-works pairing when connecting to a device that is not paired yet.
# Devices with a fixed PIN still need `divoom-pi pair` or bluetoothctl once.
auto_pair = true

# Only change this if bluetoothctl lives somewhere unusual.
bluetoothctl = bluetoothctl

[discovery]
# Periodically scan for Divoom devices and announce them over mDNS so Home
# Assistant discovers them by itself. Turn this off if you would rather add
# the device manually in Home Assistant.
enabled = true

# Only announce devices whose Bluetooth name looks like a Divoom (Ditoo,
# Pixoo, Timebox, Tivoo, Timoo, Aurabox, Divoom). Setting this to false
# announces everything the adapter can see, which is rarely what you want.
filter = true

# Seconds to wait after startup before the first scan.
initial_delay = 5

# Seconds between scans while new devices are still turning up...
interval = 60

# ...and once a scan stops finding anything new. Discovery only has to succeed
# once for Home Assistant to create the device, and on a Pi Zero W the WiFi and
# Bluetooth radios share one antenna - scanning constantly costs throughput for
# nothing.
idle_interval = 900

# How long each scan runs.
duration = 12

# Scanning during an active Bluetooth connection makes the link stutter, so by
# default discovery waits until Home Assistant is done talking to the device.
while_connected = false

[mdns]
# Publish the _divoom_esp32._tcp records Home Assistant's zeroconf discovery
# looks for. Needs avahi-daemon (the installer sets it up).
enabled = true
service_dir = /etc/avahi/services
